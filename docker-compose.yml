services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      # Local development only. Override via an .env file or your secret manager for any shared environment.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fraud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fraud
      DB_USERNAME: fraud
      DB_PASSWORD: ${DB_PASSWORD:-fraud}
    ports:
      - "8080:8080"

volumes:
  pgdata:
